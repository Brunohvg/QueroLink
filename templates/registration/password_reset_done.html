{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-mail enviado — Mérito</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="/static/css/tailwind.css" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif;background:#F5F7FA;}</style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm text-center">
        <div class="w-16 h-16 mx-auto mb-5 rounded-2xl bg-emerald-50 flex items-center justify-center">
            <svg class="w-8 h-8 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
        </div>
        <h1 class="text-[20px] font-bold text-gray-900 mb-2">E-mail enviado!</h1>
        <p class="text-[14px] text-gray-500 mb-6 leading-relaxed">Se o e-mail informado estiver cadastrado, voce recebera um link para redefinir sua senha em instantes.</p>
        <p class="text-[12px] text-gray-400">Verifique sua caixa de entrada e a pasta de spam.</p>
        <a href="{% url 'dashboard:login' %}" class="inline-block mt-8 text-[13px] text-brand-600 hover:text-brand-700 font-medium">Voltar ao login</a>
    </div>
</body>
</html>

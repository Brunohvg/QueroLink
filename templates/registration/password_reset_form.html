{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci minha senha — Mérito</title>
    <link href="{% static 'css/tailwind.css' %}" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background: #F5F7FA; }
        input, button { font-size: 16px !important; }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <img src="{% static 'img/merito-logo.png' %}" alt="Mérito by Vidalys" class="h-10 w-auto mx-auto mb-4">
            <h1 class="text-[20px] font-bold text-gray-900 mb-1">Esqueci minha senha</h1>
            <p class="text-[14px] text-gray-500">Digite seu e-mail e enviaremos um link para redefinir sua senha.</p>
        </div>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="id_email" class="block text-[13px] font-medium text-gray-700 mb-1.5">E-mail</label>
                <input type="email" name="email" id="id_email" required autofocus
                       class="w-full px-4 py-3 bg-white border-2 border-gray-100 rounded-2xl text-[16px] outline-none transition-all focus:border-brand-400 focus:ring-2 focus:ring-brand-100"
                       placeholder="seu@email.com">
                {% if form.email.errors %}<p class="text-[12px] text-red-500 mt-1">{{ form.email.errors.0 }}</p>{% endif %}
            </div>
            <button type="submit" class="w-full bg-gray-900 hover:bg-gray-800 text-white font-semibold py-3.5 rounded-2xl text-[15px] transition shadow-lg active:scale-[0.97]">
                Enviar link de redefinicao
            </button>
        </form>

        <div class="text-center mt-6">
            <a href="{% url 'dashboard:login' %}" class="text-[13px] text-gray-400 hover:text-brand-600 font-medium transition">Voltar ao login</a>
        </div>

        <p class="text-center mt-8 text-[11px] text-gray-300">
            Mérito by Vidalys &middot; <a href="mailto:contato@vidalys.com.br" class="hover:text-gray-400">contato@vidalys.com.br</a>
        </p>
    </div>
</body>
</html>

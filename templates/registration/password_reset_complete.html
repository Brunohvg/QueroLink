{% extends 'dashboard/base_desktop.html' %}
{% block title %}Senha redefinida — Mérito{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-10">
  <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-8 text-center">
    <div class="w-14 h-14 mx-auto mb-4 rounded-2xl bg-emerald-50 flex items-center justify-center">
      <svg class="w-7 h-7 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    </div>
    <h1 class="text-[20px] font-bold text-gray-900 mb-2">Senha redefinida!</h1>
    <p class="text-[14px] text-gray-500 mb-6">Sua senha foi alterada com sucesso. Agora voce pode acessar sua conta.</p>
    <a href="{% url 'dashboard:login' %}" class="inline-flex items-center gap-2 bg-gray-900 hover:bg-gray-800 text-white font-semibold py-2.5 px-5 rounded-xl text-[14px] transition shadow-sm active:scale-[0.97]">
      Fazer login
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
    </a>
  </div>
</div>
{% endblock %}

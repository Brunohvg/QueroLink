<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta — VendaPay</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card glass" style="max-width: 520px;">
            <div class="login-header">
                <h1>Criar conta</h1>
                <p style="color: var(--text-secondary); font-size: 0.875rem;">Cadastre sua loja no VendaPay</p>
            </div>

            <div id="toast-container" class="fixed top-4 right-4 z-[9999] flex flex-col gap-2 pointer-events-none max-w-sm"></div>
            <script>
            function showToast(message, type, duration) {
                var c={
                    success:{bg:'bg-emerald-50',border:'border-emerald-200',text:'text-emerald-700',dot:'bg-emerald-500',icon:'<svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>'},
                    error:{bg:'bg-red-50',border:'border-red-200',text:'text-red-700',dot:'bg-red-500',icon:'<svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>'},
                    warning:{bg:'bg-amber-50',border:'border-amber-200',text:'text-amber-700',dot:'bg-amber-500',icon:'<svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"></path></svg>'},
                    info:{bg:'bg-blue-50',border:'border-blue-200',text:'text-blue-700',dot:'bg-blue-500',icon:'<svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>'},
                };
                var s=c[type]||c.info;
                duration=duration||(type==='error'?6000:4000);
                var el=document.createElement('div');
                el.className='pointer-events-auto flex items-start gap-3 px-4 py-3 rounded-xl border shadow-lg toast-enter '+s.bg+' '+s.border;
                el.innerHTML='<div class="flex-shrink-0 mt-0.5">'+s.icon+'</div><div class="flex-1 min-w-0"><p class="text-sm font-medium '+s.text+'"></p></div><button onclick="this.parentElement.remove()" class="flex-shrink-0 text-gray-400 hover:text-gray-600 transition"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button><div class="absolute bottom-0 left-0 h-0.5 rounded-full '+s.dot+'" style="width:100%;animation:shrink '+duration+'ms linear forwards;"></div>';
                el.querySelector('p').textContent = message;
                document.getElementById('toast-container').appendChild(el);
                setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},duration+300);
            }
            </script>
            <style>
            .toast-enter{animation:toastIn 0.3s ease forwards}
            .toast-leave{animation:toastOut 0.3s ease forwards}
            @keyframes toastIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
            @keyframes toastOut{from{transform:translateX(0);opacity:1}to{transform:translateX(100%);opacity:0}}
            @keyframes shrink{from{width:100%}to{width:0%}}
            </style>
            {% if messages %}
            <script>
            {% for message in messages %}
            showToast("{{ message|escapejs }}", "{% if message.tags == 'error' %}error{% elif message.tags == 'success' %}success{% else %}info{% endif %}");
            {% endfor %}
            </script>
            {% endif %}

            <form method="post" action="{% url 'accounts:signup' %}">
                {% csrf_token %}

                <div class="form-group">
                    <label class="form-label" for="id_company_name">Nome da empresa</label>
                    <input type="text" id="id_company_name" name="company_name" class="form-control" required
                           placeholder="Nome da sua loja" autofocus
                           value="{{ form.company_name.value|default_if_none:'' }}">
                </div>

                <div class="form-group">
                    <label class="form-label" for="id_cnpj">CNPJ</label>
                    <input type="text" id="id_cnpj" name="cnpj" class="form-control" required
                           placeholder="00.000.000/0000-00" maxlength="18"
                           oninput="this.value=cnpjMask(this.value)"
                           value="{{ form.cnpj.value|default_if_none:'' }}">
                </div>

                <div class="form-group">
                    <label class="form-label" for="id_responsible_name">Nome do responsavel</label>
                    <input type="text" id="id_responsible_name" name="responsible_name" class="form-control" required
                           placeholder="Seu nome completo"
                           value="{{ form.responsible_name.value|default_if_none:'' }}">
                </div>

                <div class="form-group">
                    <label class="form-label" for="id_email">E-mail</label>
                    <input type="email" id="id_email" name="email" class="form-control" required
                           placeholder="seu@email.com"
                           value="{{ form.email.value|default_if_none:'' }}">
                </div>

                <div class="form-group">
                    <label class="form-label" for="id_password">Senha</label>
                    <input type="password" id="id_password" name="password" class="form-control" required
                           placeholder="••••••••" autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label class="form-label" for="id_password_confirm">Confirmar senha</label>
                    <input type="password" id="id_password_confirm" name="password_confirm" class="form-control" required
                           placeholder="••••••••" autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label class="form-label" for="id_plan">Plano</label>
                    <select id="id_plan" name="plan" class="form-control" style="padding-left: 14px;">
                        {% for value, label in form.plan.field.choices %}
                        <option value="{{ value }}" {% if form.plan.value == value %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="id_billing_cycle">Ciclo de cobranca</label>
                    <select id="id_billing_cycle" name="billing_cycle" class="form-control" style="padding-left: 14px;">
                        {% for value, label in form.billing_cycle.field.choices %}
                        <option value="{{ value }}" {% if form.billing_cycle.value == value %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                    <p style="color: var(--text-secondary); font-size: 0.75rem; margin-top: 4px;">14 dias gratis em qualquer plano.</p>
                </div>

                <input type="text" name="website" style="display:none;" tabindex="-1" autocomplete="off">

                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 0.5rem;">
                    Criar conta
                </button>
            </form>

            <p style="text-align: center; margin-top: 1.5rem; color: var(--text-secondary); font-size: 0.875rem;">
                Ja tem uma conta? <a href="{% url 'dashboard:login' %}" style="color: var(--primary-color);">Fazer login</a>
            </p>
        </div>
    </div>
<script>
function cnpjMask(v) {
    v = v.replace(/\D/g, '');
    if (v.length > 14) v = v.slice(0, 14);
    if (v.length > 12) v = v.slice(0, 2) + '.' + v.slice(2, 5) + '.' + v.slice(5, 8) + '/' + v.slice(8, 12) + '-' + v.slice(12);
    else if (v.length > 8) v = v.slice(0, 2) + '.' + v.slice(2, 5) + '.' + v.slice(5, 8) + '/' + v.slice(8);
    else if (v.length > 5) v = v.slice(0, 2) + '.' + v.slice(2, 5) + '.' + v.slice(5);
    else if (v.length > 2) v = v.slice(0, 2) + '.' + v.slice(2);
    return v;
}
</script>
</body>
</html>

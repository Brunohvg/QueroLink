{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta — Mérito</title>
    <link href="{% static 'css/tailwind.css' %}" rel="stylesheet">
    <script>
        function showToast(m, t) {
            var c = {success:{bg:'bg-emerald-50',border:'border-emerald-200',text:'text-emerald-700',icon:'<svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>'},error:{bg:'bg-red-50',border:'border-red-200',text:'text-red-700',icon:'<svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>'}};
            var s = c[t]||c.error;
            var el = document.createElement('div');
            el.className = 'pointer-events-auto flex items-start gap-3 px-4 py-3 rounded-2xl border shadow-lg fixed top-4 right-4 z-[9999] max-w-sm w-full animate-slide-in ' + s.bg + ' ' + s.border;
            el.innerHTML = '<div class="flex-shrink-0 mt-0.5">' + s.icon + '</div><div class="flex-1"><p class="text-sm font-medium ' + s.text + '"></p></div><button onclick="this.parentElement.remove()" class="flex-shrink-0 ml-1"><svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>';
            el.querySelector('p').textContent = m;
            document.body.appendChild(el);
            setTimeout(function(){if(el.parentNode)el.remove();},4000);
        }
        function cnpjMask(v) {
            v = v.replace(/\D/g,''); if(v.length>14)v=v.slice(0,14);
            if(v.length>12)v=v.slice(0,2)+'.'+v.slice(2,5)+'.'+v.slice(5,8)+'/'+v.slice(8,12)+'-'+v.slice(12);
            else if(v.length>8)v=v.slice(0,2)+'.'+v.slice(2,5)+'.'+v.slice(5,8)+'/'+v.slice(8);
            else if(v.length>5)v=v.slice(0,2)+'.'+v.slice(2,5)+'.'+v.slice(5);
            else if(v.length>2)v=v.slice(0,2)+'.'+v.slice(2);
            return v;
        }
    </script>
    <style>
        body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', 'Inter', sans-serif; background: #F5F7FA; }
        @keyframes slideIn { from{transform:translateX(120%);opacity:0} to{transform:translateX(0);opacity:1} }
        .animate-slide-in { animation: slideIn 0.35s cubic-bezier(0.21,1.02,0.73,1) forwards; }
        input, select, button { font-size: 16px !important; }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex items-center justify-center p-4">
    {% if messages %}
    <script>
    {% for message in messages %}
    showToast("{{ message|escapejs }}", "{% if message.tags == 'error' %}error{% elif message.tags == 'success' %}success{% else %}info{% endif %}");
    {% endfor %}
    </script>
    {% endif %}

    <div class="w-full max-w-lg">
        <div class="text-center mb-8">
            <img src="{% static 'img/merito-logo.png' %}" alt="Mérito by Vidalys" class="h-12 w-auto mx-auto mb-4">
            <h1 class="font-display text-[24px] font-bold text-gray-900 tracking-tight">Criar conta</h1>
            <p class="text-[14px] text-gray-400 mt-1">Cadastre sua loja</p>
        </div>

        <div class="bg-white rounded-2xl border border-gray-100 shadow-[0_1px_3px_-1px_rgba(0,0,0,0.04),0_4px_16px_-4px_rgba(67,97,238,0.06)] p-6">
            <form method="post" action="{% url 'accounts:signup' %}">
                {% csrf_token %}
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="sm:col-span-2">
                        <label class="block text-[13px] font-medium text-gray-700 mb-1.5">Nome da empresa</label>
                        <input type="text" name="company_name" required
                               class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-[14px] outline-none transition-all focus:border-brand-400 focus:ring-2 focus:ring-brand-100"
                               placeholder="Nome da sua loja"
                               value="{{ form.company_name.value|default_if_none:'' }}">
                    </div>
                    <div>
                        <label class="block text-[13px] font-medium text-gray-700 mb-1.5">CNPJ</label>
                        <input type="text" name="cnpj" required
                               class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-[14px] outline-none transition-all focus:border-brand-400 focus:ring-2 focus:ring-brand-100"
                               placeholder="00.000.000/0000-00" maxlength="18"
                               oninput="this.value=cnpjMask(this.value)"
                               value="{{ form.cnpj.value|default_if_none:'' }}">
                    </div>
                    <div>
                        <label class="block text-[13px] font-medium text-gray-700 mb-1.5">Nome do responsavel</label>
                        <input type="text" name="responsible_name" required
                               class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-[14px] outline-none transition-all focus:border-brand-400 focus:ring-2 focus:ring-brand-100"
                               placeholder="Seu nome completo"
                               value="{{ form.responsible_name.value|default_if_none:'' }}">
                    </div>
                    <div class="sm:col-span-2">
                        <label class="block text-[13px] font-medium text-gray-700 mb-1.5">E-mail</label>
                        <input type="email" name="email" required
                               class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-[14px] outline-none transition-all focus:border-brand-400 focus:ring-2 focus:ring-brand-100"
                               placeholder="seu@email.com"
                               value="{{ form.email.value|default_if_none:'' }}">
                    </div>
                    <div>
                        <label class="block text-[13px] font-medium text-gray-700 mb-1.5">Senha</label>
                        <input type="password" name="password" required
                               class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-[14px] outline-none transition-all focus:border-brand-400 focus:ring-2 focus:ring-brand-100"
                               placeholder="Minimo 8 caracteres" autocomplete="new-password">
                    </div>
                    <div>
                        <label class="block text-[13px] font-medium text-gray-700 mb-1.5">Confirmar senha</label>
                        <input type="password" name="password_confirm" required
                               class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-[14px] outline-none transition-all focus:border-brand-400 focus:ring-2 focus:ring-brand-100"
                               placeholder="Repita a senha" autocomplete="new-password">
                    </div>
                    <div>
                        <label class="block text-[13px] font-medium text-gray-700 mb-1.5">Plano</label>
                        <select name="plan" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-[14px] outline-none transition-all focus:border-brand-400 focus:ring-2 focus:ring-brand-100">
                            {% for value, label in form.plan.field.choices %}
                            <option value="{{ value }}" {% if form.plan.value == value %}selected{% endif %}>{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-[13px] font-medium text-gray-700 mb-1.5">Ciclo de cobranca</label>
                        <select name="billing_cycle" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-[14px] outline-none transition-all focus:border-brand-400 focus:ring-2 focus:ring-brand-100">
                            {% for value, label in form.billing_cycle.field.choices %}
                            <option value="{{ value }}" {% if form.billing_cycle.value == value %}selected{% endif %}>{{ label }}</option>
                            {% endfor %}
                        </select>
                        <p class="text-[11px] text-gray-400 mt-1.5">14 dias gratis em qualquer plano.</p>
                    </div>
                </div>

                <input type="text" name="website" style="display:none;" tabindex="-1" autocomplete="off">

                <button type="submit" class="w-full mt-5 py-3 bg-brand-500 hover:bg-brand-600 text-white font-semibold rounded-2xl transition-all text-[15px] shadow-lg shadow-brand-100 active:scale-[0.97]">
                    Criar conta
                </button>
            </form>
        </div>

        <p class="text-center mt-5 text-[14px] text-gray-400">
            Ja tem uma conta?
            <a href="{% url 'dashboard:login' %}" class="text-brand-600 hover:text-brand-700 font-medium">Fazer login</a>
        </p>
    </div>
</body>
</html>

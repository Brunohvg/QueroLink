<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family: Arial, sans-serif; padding: 20px; color: #333;">
  <h2>Boleto emitido</h2>
  <p>Valor: <strong>{{ amount }}</strong></p>
  <p>Vencimento: <strong>{{ due_date }}</strong></p>
  {% if provider_url %}
  <p><a href="{{ provider_url }}" style="display: inline-block; padding: 10px 20px; background: #1463FF; color: white; text-decoration: none; border-radius: 8px;">Abrir Boleto</a></p>
  {% endif %}
  {% if provider_barcode %}
  <p>Linha digitavel: <code style="background: #f5f5f5; padding: 8px; display: block; border-radius: 4px; font-size: 14px;">{{ provider_barcode }}</code></p>
  {% endif %}
  <hr>
  <p style="color: #999; font-size: 12px;">Merito by Vidalys</p>
</body>
</html>

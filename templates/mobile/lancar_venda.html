{% extends 'mobile/base_mobile.html' %}
{% block title %}Lancar Venda — QueroLink{% endblock %}
{% block content %}
<div class="space-y-4" x-data="lancarVenda()">
    <div class="flex items-center gap-3">
        <a href="{% url 'dashboard:mobile_home' %}" class="tap-target flex items-center justify-center w-10 h-10">
            <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </a>
        <h1 class="font-display text-[18px] font-semibold text-gray-900">Lancar Venda</h1>
    </div>

    {% if success %}
    <div class="surface-hero text-center">
        <p class="font-display text-[20px] font-semibold text-gray-900">Venda registrada!</p>
        <p class="font-display text-[36px] font-semibold text-success-700 mt-2" x-text="formatCurrency(lastAmount)"></p>
        <a href="{% url 'dashboard:mobile_lancar_venda' %}"
           class="inline-block mt-4 bg-brand-500 hover:bg-brand-600 text-white font-medium px-6 py-2.5 rounded-xl tap-target text-[15px]">
            Nova Venda
        </a>
    </div>
    {% else %}

    {% if error %}
    <div class="bg-danger-50 border border-danger-500/20 text-danger-700 px-4 py-3 rounded-xl text-sm">{{ error }}</div>
    {% endif %}

    <form method="post" action="{% url 'dashboard:mobile_lancar_venda' %}" class="space-y-4">
        {% csrf_token %}
        <div>
            <label for="valor_display" class="block text-[13px] text-gray-500 mb-1">Valor da Venda</label>
            <div class="relative">
                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 text-lg font-medium">R$</span>
                <input type="text" id="valor_display" x-ref="valorDisplay" x-on:input="formatInput()"
                       class="w-full pl-12 pr-4 py-4 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent font-display text-[28px] font-semibold text-gray-900"
                       placeholder="0,00" required style="font-size:28px!important">
            </div>
            <input type="hidden" name="amount_cents" x-ref="amountCents" value="0">
        </div>
        <div>
            <label for="sale_date" class="block text-[13px] text-gray-500 mb-1">Data</label>
            <input type="date" id="sale_date" name="sale_date" x-ref="saleDate"
                   class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent"
                   style="font-size:16px!important">
        </div>
        <div>
            <label for="notes" class="block text-[13px] text-gray-500 mb-1">Observacao (opcional)</label>
            <input type="text" id="notes" name="notes"
                   class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent"
                   placeholder="Ex: Cliente pagou no PIX" style="font-size:16px!important">
        </div>
        <button type="submit" x-bind:disabled="amountCents <= 0"
                x-bind:class="amountCents > 0 ? 'bg-success-500 hover:bg-success-700' : 'bg-gray-300 cursor-not-allowed'"
                class="w-full text-white font-medium py-4 rounded-xl transition shadow-lg tap-target text-[15px]">
            Registrar Venda
        </button>
    </form>
    {% endif %}
</div>

<script>
function lancarVenda() {
    return {
        amountCents: 0,
        lastAmount: {{ request.session.last_venda_amount|default:0 }},
        init() { this.$refs.saleDate.value = new Date().toISOString().split('T')[0]; },
        formatInput() {
            var raw = this.$refs.valorDisplay.value.replace(/\D/g, '');
            if (!raw) { this.$refs.valorDisplay.value = ''; this.amountCents = 0; this.$refs.amountCents.value = '0'; return; }
            this.amountCents = parseInt(raw, 10);
            this.$refs.amountCents.value = this.amountCents;
            this.$refs.valorDisplay.value = Math.floor(raw/100) + ',' + String(raw%100).padStart(2,'0');
        },
        formatCurrency(c) { return 'R$ '+Math.floor(c/100)+','+String(c%100).padStart(2,'0'); }
    }
}
</script>
{% endblock %}

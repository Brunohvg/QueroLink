{% extends 'mobile/base_mobile.html' %}
{% block title %}Lançar Venda — QueroLink{% endblock %}
{% block content %}
<div class="space-y-4" x-data="lancarVenda()">
    <div class="flex items-center gap-3">
        <a href="{% url 'dashboard:mobile_home' %}" class="tap-target flex items-center justify-center w-10 h-10">
            <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </a>
        <h1 class="text-xl font-bold text-gray-900">Lançar Venda</h1>
    </div>

    {% if success %}
    <div class="bg-green-50 border border-green-200 text-green-700 px-4 py-4 rounded-xl text-center">
        <div class="w-14 h-14 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-2">
            <svg class="w-7 h-7 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        </div>
        <p class="font-semibold text-lg">Venda registrada!</p>
        <p class="text-sm mt-1">Valor: <span x-text="formatCurrency(lastAmount)"></span></p>
        <a href="{% url 'dashboard:mobile_lancar_venda' %}"
           class="inline-block mt-3 bg-primary text-white font-medium px-6 py-2.5 rounded-xl tap-target">
            Nova Venda
        </a>
    </div>
    {% else %}

    {% if error %}
    <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm">{{ error }}</div>
    {% endif %}

    <form method="post" action="{% url 'dashboard:mobile_lancar_venda' %}" class="space-y-4">
        {% csrf_token %}
        <div>
            <label for="valor_display" class="block text-sm font-medium text-gray-700 mb-1">Valor da Venda</label>
            <div class="relative">
                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 text-lg font-medium">R$</span>
                <input type="text" id="valor_display" x-ref="valorDisplay"
                       x-on:input="formatInput()"
                       class="w-full pl-12 pr-4 py-4 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-lg font-semibold"
                       placeholder="0,00" required
                       style="font-size: 24px !important;">
            </div>
            <input type="hidden" name="amount_cents" x-ref="amountCents" value="0">
        </div>

        <div>
            <label for="sale_date" class="block text-sm font-medium text-gray-700 mb-1">Data</label>
            <input type="date" id="sale_date" name="sale_date"
                   x-ref="saleDate"
                   class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                   style="font-size: 16px !important;">
        </div>

        <div>
            <label for="notes" class="block text-sm font-medium text-gray-700 mb-1">Observação (opcional)</label>
            <input type="text" id="notes" name="notes"
                   class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                   placeholder="Ex: Cliente pagou no PIX"
                   style="font-size: 16px !important;">
        </div>

        <button type="submit"
                x-bind:disabled="amountCents <= 0"
                x-bind:class="amountCents > 0 ? 'bg-primary hover:bg-primary-dark' : 'bg-gray-300 cursor-not-allowed'"
                class="w-full text-white font-semibold py-4 rounded-xl transition shadow-lg tap-target">
            Registrar Venda
        </button>
    </form>
    {% endif %}
</div>

<script>
function lancarVenda() {
    return {
        amountCents: 0,
        lastAmount: {{ request.session.last_venda_amount|default:0 }},
        init() {
            var today = new Date().toISOString().split('T')[0];
            this.$refs.saleDate.value = today;
        },
        formatInput() {
            var raw = this.$refs.valorDisplay.value.replace(/\D/g, '');
            if (!raw) {
                this.$refs.valorDisplay.value = '';
                this.amountCents = 0;
                this.$refs.amountCents.value = '0';
                return;
            }
            this.amountCents = parseInt(raw, 10);
            this.$refs.amountCents.value = this.amountCents;
            var reais = Math.floor(raw / 100);
            var cents = raw % 100;
            this.$refs.valorDisplay.value = reais + ',' + String(cents).padStart(2, '0');
        },
        formatCurrency(cents) {
            var r = Math.floor(cents / 100);
            var c = String(cents % 100).padStart(2, '0');
            return 'R$ ' + r + ',' + c;
        }
    }
}
</script>
{% endblock %}

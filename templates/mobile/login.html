{% extends 'mobile/base_mobile.html' %}
{% block title %}Login — QueroLink{% endblock %}
{% block content %}
<div class="flex flex-col items-center justify-center min-h-[80vh]">
    <div class="w-full max-w-sm">

        <div class="text-center mb-10">
            <div class="w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-4" style="background: linear-gradient(135deg, #a5b4fc, #6366f1);">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <h1 class="font-display text-[26px] font-bold text-slate-800 tracking-tight">QueroLink</h1>
            <p class="text-[13px] text-slate-400 mt-1.5 font-medium">Acesso do vendedor</p>
        </div>

        {% if error %}
        <div class="bg-danger-50 border border-danger-200/50 text-danger-700 px-4 py-3 rounded-2xl text-sm mb-5">{{ error }}</div>
        {% endif %}

        <form method="post" action="{% url 'dashboard:login' %}" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="identifier" class="block text-[13px] font-medium text-slate-600 mb-1.5">E-mail ou usuario</label>
                <input type="text" id="identifier" name="identifier" required autofocus
                       class="input-field" placeholder="seu@email.com ou usuario">
            </div>
            <div>
                <label for="password" class="block text-[13px] font-medium text-slate-600 mb-1.5">Senha</label>
                <input type="password" id="password" name="password" required
                       class="input-field" placeholder="Sua senha">
            </div>
            <button type="submit" class="btn-primary mt-2">Entrar</button>
        </form>

        <p class="text-center mt-6">
            <a href="{% url 'dashboard:mobile_forgot_password' %}" class="text-brand-600 hover:text-brand-700 text-sm font-medium tap-target inline-flex items-center gap-1 py-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
                Esqueci minha senha
            </a>
        </p>
    </div>
</div>
{% endblock %}

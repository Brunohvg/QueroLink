{% extends 'mobile/base_mobile.html' %}
{% load static %}
{% block title %}Login — Mérito{% endblock %}
{% block content %}
<div class="flex flex-col items-center justify-center min-h-[85vh]">
  <div class="w-full max-w-sm fade-up">

    <div class="text-center mb-10">
      <img src="{% static 'img/merito-logo.svg' %}" alt="Mérito by Vidalys" class="h-12 mx-auto mb-4">
      <p class="text-[12px] text-gray-400 mt-1 font-medium">Acesso do vendedor</p>
    </div>

    {% if error %}
    <script>showToast("{{ error|escapejs }}", "error");</script>
    {% endif %}

    <form method="post" action="{% url 'dashboard:login' %}" class="space-y-5">
      {% csrf_token %}
      <div>
        <label for="identifier" class="block text-[14px] font-medium text-gray-700 mb-1.5">E-mail ou usuario</label>
        <input type="text" id="identifier" name="identifier" required autofocus
               class="input-field" placeholder="seu@email.com">
      </div>
      <div>
        <label for="password" class="block text-[14px] font-medium text-gray-700 mb-1.5">Senha</label>
        <input type="password" id="password" name="password" required
               class="input-field" placeholder="Sua senha">
      </div>
      <label class="flex items-center gap-2.5 cursor-pointer tap-target py-1">
        <input type="checkbox" name="remember_me" value="1"
               class="w-5 h-5 rounded-lg border-2 border-gray-300 text-brand-500 focus:ring-brand-200 cursor-pointer">
        <span class="text-[14px] text-gray-600 font-medium">Manter conectado</span>
      </label>
      <button type="submit" class="btn-primary mt-1">Entrar</button>
    </form>

    <p class="text-center mt-6">
      <a href="{% url 'dashboard:mobile_forgot_password' %}"
         class="inline-flex items-center gap-2 text-brand-600 hover:text-brand-700 text-[14px] font-medium py-2 tap-target">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
        Esqueci minha senha
      </a>
    </p>
  </div>
</div>
{% endblock %}

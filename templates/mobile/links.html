{% extends 'mobile/base_mobile.html' %}
{% block title %}Meus Links — VendaPay{% endblock %}
{% block content %}
<div class="space-y-4 fade-up" x-data="sellerLinksPage()">
  <div class="flex items-center gap-3">
    <a href="{% url 'dashboard:mobile_home' %}"
       class="w-10 h-10 bg-white rounded-xl card-shadow flex items-center justify-center tap-target text-gray-400 hover:text-brand-500 transition-all active:scale-[0.95]">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
    </a>
    <h1 class="font-display text-[20px] font-bold text-gray-900">Meus Links</h1>
  </div>

  {% verbatim %}
  <div x-show="showForm" class="bg-white rounded-2xl p-5 card-shadow space-y-4">
    <p class="text-[15px] font-bold text-gray-900">Novo Link de Pagamento</p>
    <div>
      <label class="block text-[13px] font-medium text-gray-600 mb-1.5">Nome do cliente</label>
      <input type="text" x-model="form.customer" class="input-field" placeholder="Nome do cliente">
    </div>
    <div>
      <label class="block text-[13px] font-medium text-gray-600 mb-1.5">Valor (R$)</label>
      <input type="text" x-model="form.value" class="input-field" placeholder="100,00">
    </div>
    <div>
      <label class="block text-[13px] font-medium text-gray-600 mb-1.5">Parcelas</label>
      <select x-model="form.installments" class="input-field">
        <option value="1">1x (a vista)</option>
        <option value="2">2x</option>
        <option value="3">3x</option>
      </select>
    </div>
    <p x-show="formError" class="text-[13px] text-red-500" x-text="formError"></p>
    <div x-show="formSuccess" class="bg-emerald-50 border border-emerald-100 text-emerald-700 px-4 py-3 rounded-xl text-[13px]" x-text="formSuccess"></div>
    <div class="flex gap-2 pt-1">
      <button @click="createLink()" :disabled="creating"
              class="flex-1 bg-gray-900 hover:bg-gray-800 disabled:bg-gray-300 text-white font-semibold py-3 rounded-xl transition-all text-[15px] tap-target shadow-sm active:scale-[0.97]">
        <span x-show="!creating">Gerar Link</span>
        <span x-show="creating">Gerando...</span>
      </button>
      <button @click="showForm=false; formError=''; formSuccess=''"
              class="px-5 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-[15px] font-medium transition tap-target">Cancelar</button>
    </div>
  </div>

  <button @click="showForm=!showForm" x-show="!showForm"
          class="w-full bg-gray-900 hover:bg-gray-800 text-white font-semibold py-4 rounded-2xl transition-all shadow-lg shadow-gray-100 tap-target active:scale-[0.97] flex items-center justify-center gap-2">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
    <span class="text-[15px]">Novo Link</span>
  </button>

  <div x-show="!orders.length && !showForm" class="text-center pt-8">
    <p class="text-gray-500 font-medium text-[15px]">Nenhum link gerado ainda.</p>
  </div>

  <div class="space-y-2">
    <template x-for="o in orders" :key="o.uuid">
      <div class="bg-white rounded-2xl p-4 card-shadow">
        <div class="flex items-start justify-between gap-2 mb-1.5">
          <span class="text-[15px] font-bold text-gray-900 truncate flex-1 min-w-0" x-text="o.customer_name"></span>
          <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-medium flex-shrink-0"
                :class="{'bg-gray-100 text-gray-600': o.status==='PENDING',
                         'bg-emerald-50 text-emerald-700': o.status==='COMPLETED',
                         'bg-red-50 text-red-700': o.status==='CANCELED' || o.status==='FAILED' || o.status==='EXPIRED',
                         'bg-amber-50 text-amber-700': o.status==='SUSPENDED'}">
            <span class="w-1.5 h-1.5 rounded-full"
                  :class="{'bg-gray-400': o.status==='PENDING',
                           'bg-emerald-500': o.status==='COMPLETED',
                           'bg-red-500': o.status==='CANCELED' || o.status==='FAILED' || o.status==='EXPIRED',
                           'bg-amber-500': o.status==='SUSPENDED'}"></span>
            <span x-text="o.status_display"></span>
          </span>
        </div>
        <p class="text-[16px] font-bold text-brand-600 mt-1" x-text="formatMoneyBRL(o.total_amount)"></p>
        <p x-show="o.refusal_reason" class="text-[12px] text-red-500 mt-1">Motivo: <span x-text="o.refusal_reason"></span></p>
        <div class="flex items-center gap-2 mt-3" x-show="o.link_url && o.status==='PENDING'">
          <code class="text-[12px] text-gray-500 bg-gray-50 px-3 py-2 rounded-xl flex-1 truncate border border-gray-100" x-text="o.link_url"></code>
          <button @click="copyLink(o.link_url)" class="text-brand-600 text-[13px] font-semibold hover:underline flex-shrink-0 py-2 px-3 tap-target">Copiar</button>
        </div>
        <p class="text-[12px] text-gray-400 mt-2" x-text="new Date(o.created_at).toLocaleDateString('pt-BR')"></p>
      </div>
    </template>
  </div>
  {% endverbatim %}
</div>

<script>
function sellerLinksPage() {
    return {
        orders: {% if orders_json %}{{ orders_json|safe }}{% else %}[]{% endif %},
        showForm: false,
        creating: false,
        formError: '',
        formSuccess: '',
        form: { customer: '', value: '', installments: '1' },

        async createLink() {
            this.formError = '';
            this.formSuccess = '';
            if (!this.form.customer || !this.form.value) {
                this.formError = 'Preencha nome do cliente e valor.';
                return;
            }
            this.creating = true;
            try {
                var r = await fetch('/api/seller/links/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCSRFToken() },
                    body: JSON.stringify({
                        customer_name: this.form.customer,
                        amount: this.form.value,
                        installments: parseInt(this.form.installments),
                    })
                });
                var d = await r.json();
                if (r.ok) {
                    this.formSuccess = 'Link gerado!';
                    this.showForm = false;
                    this.form = { customer: '', value: '', installments: '1' };
                    this.orders.unshift({
                        uuid: d.uuid,
                        customer_name: d.customer_name,
                        total_amount: d.total_amount,
                        status: 'PENDING',
                        status_display: 'Pendente',
                        link_url: d.link_url,
                        refusal_reason: null,
                        created_at: new Date().toISOString(),
                    });
                    showToast('Link gerado com sucesso!', 'success');
                } else {
                    this.formError = d.error || d.detail || 'Erro ao gerar link.';
                    showToast(this.formError, 'error');
                }
            } catch (e) {
                this.formError = 'Erro de conexao.';
                showToast(this.formError, 'error');
            }
            this.creating = false;
        },

        copyLink(url) {
            navigator.clipboard.writeText(url);
        }
    }
}
</script>
{% endblock %}

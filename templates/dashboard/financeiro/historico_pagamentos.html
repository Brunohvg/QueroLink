{% extends 'dashboard/base_desktop.html' %}
{% block title %}Histórico de Pagamentos — QueroLink{% endblock %}
{% block content %}
<div x-data="historicoPage()" x-init="load()">
    <h1 class="font-display text-[18px] font-semibold text-gray-900 mb-6">Historico de Pagamentos</h1>

    <template x-for="p in periods" :key="p.uuid">
        <div class="surface-card mb-4">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-3">
                    <h3 class="font-semibold text-[18px]" x-text="String(p.month).padStart(2,'0')+'/'+p.year"></h3>
                    <span x-show="p.status==='APROVADA'" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-success-50 text-success-700">APROVADA</span>
                    <span x-show="p.status==='PAGA'" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-success-50 text-success-700">PAGA</span>
                </div>
                <div class="flex items-center gap-2">
                    <button @click="markPaid(p)" x-show="p.status==='APROVADA'" class="bg-success-500 hover:bg-success-700 text-white font-medium py-2 px-4 rounded-xl transition tap-target text-[15px] shadow-md flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        Marcar Pago
                    </button>
                    <a :href="'/api/financial/commissions/'+p.uuid+'/csv/'" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-2 px-4 rounded-xl transition tap-target text-[15px] flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        CSV
                    </a>
                </div>
            </div>

            <table class="w-full text-left text-[14px]">
                <thead><tr><th class="px-4 py-3 font-semibold text-gray-500 border-b border-gray-200 bg-gray-50">Vendedor</th><th class="px-4 py-3 font-semibold text-gray-500 border-b border-gray-200 bg-gray-50">Total Vendido</th><th class="px-4 py-3 font-semibold text-gray-500 border-b border-gray-200 bg-gray-50">Comissão</th><th class="px-4 py-3 font-semibold text-gray-500 border-b border-gray-200 bg-gray-50">Notificação</th></tr></thead>
                <tbody>
                    <template x-for="sc in p.seller_commissions" :key="sc.id">
                        <tr class="hover:bg-gray-50">
                            <td class="px-4 py-3 border-b border-gray-100 font-medium" x-text="sc.seller_name"></td>
                            <td class="px-4 py-3 border-b border-gray-100" x-text="'R$ '+formatMoneyBRL(sc.total_sold_amount)"></td>
                            <td class="px-4 py-3 border-b border-gray-100 font-semibold text-brand-500" x-text="'R$ '+formatMoneyBRL(sc.commission_amount)"></td>
                            <td class="px-4 py-3 border-b border-gray-100">
                                <span x-show="p.status==='PAGA'" class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-medium bg-success-50 text-success-700">
                                    <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24"><path d="M20.285 2l-11.285 11.567-5.286-5.011-3.714 3.716 9 8.728 15-15.285z"/></svg>
                                    Notificado
                                </span>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </template>
    <div x-show="!periods.length" class="text-center py-12 text-gray-500">Nenhuma competência aprovada ou paga.</div>
</div>

<script>
function getCSRFToken() {
    var name = 'csrftoken';
    var cookies = document.cookie.split(';');
    for (var i = 0; i < cookies.length; i++) {
        var c = cookies[i].trim();
        if (c.indexOf(name + '=') === 0) return c.substring(name.length + 1);
    }
    return '';
}

function historicoPage() {
    return {
        periods: [],
        async load() {
            var a = await fetch('/api/manager/commissions/APROVADA/').then(r=>r.json());
            var p = await fetch('/api/manager/commissions/PAGA/').then(r=>r.json());
            this.periods = [...a, ...p].sort((a,b)=>b.year-a.year||b.month-a.month);
        },
        async markPaid(p) {
            if (!confirm('Marcar como pago? Notificacoes serao enviadas.')) return;
            var r = await fetch(`/api/commissions/periods/${p.uuid}/mark_paid/`, { method:'POST', headers:{'X-CSRFToken': getCSRFToken()} });
            if (r.ok) this.load(); else { var d = await r.json(); alert(d.error||'Erro'); }
        },

    }
}
</script>
{% endblock %}

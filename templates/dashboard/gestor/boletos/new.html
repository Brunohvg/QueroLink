{% extends 'dashboard/base_desktop.html' %}
{% block title %}Novo Boleto — Mérito{% endblock %}
{% block content %}
<div x-data="novoBoletoPage()" x-init="init()" class="max-w-2xl mx-auto">
  <div class="mb-6">
    <a href="{% url 'dashboard:gestor_boletos' %}" class="text-sm text-gray-500 hover:text-gray-700">&larr; Voltar</a>
  </div>

  <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6">
    <h1 class="font-display text-xl font-bold text-gray-900 mb-6">Novo Boleto</h1>

    <form @submit.prevent="submit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Vendedor</label>
        <select x-model="form.seller_uuid" required class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2">
          <option value="">Selecione...</option>
          {% verbatim %}
          <template x-for="s in sellers" :key="s.uuid">
            <option :value="s.uuid" x-text="s.name"></option>
          </template>
          {% endverbatim %}
        </select>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nome do Pagador</label>
          <input type="text" x-model="form.payer_name" required class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Documento</label>
          <input type="text" x-model="form.payer_document" required class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2" placeholder="CPF ou CNPJ">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Tipo Documento</label>
          <select x-model="form.payer_document_type" class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2">
            <option value="CPF">CPF</option>
            <option value="CNPJ">CNPJ</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" x-model="form.payer_email" class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Telefone</label>
        <input type="text" x-model="form.payer_phone" required class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2" placeholder="(11) 99999-9999">
      </div>

      <div class="grid grid-cols-3 gap-4">
        <div class="col-span-1">
          <label class="block text-sm font-medium text-gray-700 mb-1">CEP</label>
          <input type="text" x-model="form.payer_zip_code" required class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2" placeholder="00000-000">
        </div>
        <div class="col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Rua</label>
          <input type="text" x-model="form.payer_street" required class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2">
        </div>
      </div>

      <div class="grid grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Numero</label>
          <input type="text" x-model="form.payer_number" required class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Complemento</label>
          <input type="text" x-model="form.payer_complement" class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Bairro</label>
          <input type="text" x-model="form.payer_neighborhood" required class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Cidade</label>
          <input type="text" x-model="form.payer_city" required class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">UF</label>
          <input type="text" x-model="form.payer_state" required maxlength="2" class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2 uppercase" placeholder="SP">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Valor (R$)</label>
          <input type="number" x-model="form.amount_cents" step="0.01" min="1" required class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2" @input="formatAmount">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Vencimento</label>
          <input type="date" x-model="form.due_date" required class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Instrucoes</label>
        <textarea x-model="form.instructions" class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2" rows="2"></textarea>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Observacoes</label>
        <textarea x-model="form.notes" class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2" rows="2"></textarea>
      </div>

      <div x-show="error" class="bg-red-50 text-red-700 text-sm rounded-lg px-4 py-3" x-text="error"></div>

      <div class="flex justify-end gap-3 pt-4 border-t border-gray-100">
        <a href="{% url 'dashboard:gestor_boletos' %}" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800">Cancelar</a>
        <button type="submit" :disabled="submitting" class="px-6 py-2 bg-brand-600 text-white text-sm font-semibold rounded-xl hover:bg-brand-700 disabled:opacity-50">
          <span x-show="!submitting">Emitir Boleto</span>
          <span x-show="submitting">Emitindo...</span>
        </button>
      </div>
    </form>
  </div>
</div>

{{ sellers_json|json_script:"sellers-data" }}
<script>
function novoBoletoPage() {
    return {
        sellers: [],
        form: {
            seller_uuid: '',
            payer_name: '',
            payer_document: '',
            payer_document_type: 'CPF',
            payer_email: '',
            payer_phone: '',
            payer_zip_code: '',
            payer_street: '',
            payer_number: '',
            payer_complement: '',
            payer_neighborhood: '',
            payer_city: '',
            payer_state: '',
            amount_cents: '',
            due_date: '',
            instructions: '',
            notes: '',
        },
        error: '',
        submitting: false,
        init() {
            var _p = JSON.parse(document.getElementById('sellers-data')?.textContent || '[]');
            if (typeof _p === 'string') _p = JSON.parse(_p);
            this.sellers = Array.isArray(_p) ? _p : [];
        },
        submit() {
            this.error = '';
            this.submitting = true;
            var payload = {};
            for (var key in this.form) {
                if (this.form.hasOwnProperty(key)) {
                    payload[key] = this.form[key] === '' ? null : this.form[key];
                }
            }
            if (payload.amount_cents) {
                var val = parseFloat(payload.amount_cents);
                if (!isNaN(val)) payload.amount_cents = Math.round(val * 100);
            }
            fetch('/api/receivables/boletos/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '',
                    'X-Idempotency-Key': Date.now().toString(),
                },
                body: JSON.stringify(payload),
            })
            .then(function(r) { return r.json().then(function(d) { return { status: r.status, data: d }; }); })
            .then(function(result) {
                if (result.status === 201) {
                    window.location.href = '/dashboard/gestor/boletos/' + result.data.uuid + '/';
                } else {
                    var detail = result.data.detail || JSON.stringify(result.data);
                    this.error = detail;
                    this.submitting = false;
                }
            }.bind(this))
            .catch(function(err) {
                this.error = 'Erro ao emitir boleto. Tente novamente.';
                this.submitting = false;
            }.bind(this));
        },
    }
}
</script>
{% endblock %}

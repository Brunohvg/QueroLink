{% extends 'dashboard/base_desktop.html' %}
{% block title %}Ranking — QueroLink{% endblock %}
{% block content %}
<div x-data="rankingPage()" x-init="load()">
    <div class="flex items-center justify-between mb-8">
        <h1 class="font-display text-[18px] font-semibold text-gray-900">Ranking de Vendedores</h1>
        <div class="flex items-center gap-3">
            <select x-model="month" @change="load()" class="px-3 py-2 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                {% for m in "123456789101112"|make_list %}
                <option value="{{ forloop.counter }}">{{ forloop.counter|stringformat:"02d" }}</option>
                {% endfor %}
            </select>
            <select x-model="year" @change="load()" class="px-3 py-2 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                <option value="2025">2025</option><option value="2026">2026</option><option value="2027">2027</option>
            </select>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8" x-show="ranking.length">
        <div class="lg:col-span-2 surface-card">
            <h2 class="text-[13px] font-semibold text-gray-500 uppercase tracking-wide mb-4">Vendas do mes</h2>
            <div class="h-64"><canvas id="rankingChart"></canvas></div>
        </div>
        <div class="surface-hero text-center" x-show="topSeller">
            <p class="text-[13px] font-semibold text-gray-500 uppercase tracking-wide mb-6">Vendedor do mes</p>
            <p class="font-display text-[36px] font-semibold text-gray-900 leading-tight" x-text="'R$ ' + formatMoneyBRL(topSeller?.total_sold || 0)"></p>
            <p class="text-[15px] font-medium text-gray-700 mt-2">
                <a :href="'/dashboard/gestor/vendedores/' + (topSeller?.seller__uuid || '') + '/'" class="text-brand-500 hover:underline" x-text="topSeller?.seller__name || '-'"></a>
            </p>
            <p class="text-[13px] text-gray-500 mt-1" x-text="(topSeller?.sale_count || 0) + ' vendas'"></p>
        </div>
    </div>

    <div class="surface-card" x-show="ranking.length">
        <table class="w-full text-left text-[14px]">
            <thead>
                <tr><th class="px-4 py-3 font-semibold text-gray-500 border-b border-gray-200 bg-gray-50">#</th><th class="px-4 py-3 font-semibold text-gray-500 border-b border-gray-200 bg-gray-50">Vendedor</th><th class="px-4 py-3 font-semibold text-gray-500 border-b border-gray-200 bg-gray-50">Total</th><th class="px-4 py-3 font-semibold text-gray-500 border-b border-gray-200 bg-gray-50">Vendas</th><th class="px-4 py-3 font-semibold text-gray-500 border-b border-gray-200 bg-gray-50">Ticket Medio</th></tr>
            </thead>
            <tbody>
                <template x-for="(s, i) in ranking" :key="s.seller__uuid">
                    <tr class="hover:bg-gray-50">
                        <td class="px-4 py-3 border-b border-gray-100 font-bold text-gray-400" x-text="i + 1"></td>
                        <td class="px-4 py-3 border-b border-gray-100 font-medium">
                            <a :href="'/dashboard/gestor/vendedores/' + s.seller__uuid + '/'" class="text-brand-500 hover:underline" x-text="s.seller__name"></a>
                        </td>
                        <td class="px-4 py-3 border-b border-gray-100 font-semibold" x-text="'R$ ' + formatMoneyBRL(s.total_sold)"></td>
                        <td class="px-4 py-3 border-b border-gray-100" x-text="s.sale_count"></td>
                        <td class="px-4 py-3 border-b border-gray-100" x-text="'R$ ' + formatMoneyBRL(Math.round(s.total_sold / s.sale_count))"></td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>
    <div class="text-center py-12 text-gray-500" x-show="!ranking.length">Nenhuma venda neste periodo.</div>
</div>

<script>
function rankingPage() {
    return {
        month: new Date().getMonth()+1, year: new Date().getFullYear(), ranking: [], topSeller: null, chart: null,
        async load() {
            var r = await fetch(`/api/manager/ranking/?month=${this.month}&year=${this.year}`);
            var d = await r.json();
            this.ranking = d.ranking || []; this.topSeller = d.top_seller || null;
            this.$nextTick(() => this.drawChart());
        },
        drawChart() {
            if (this.chart) this.chart.destroy();
            var ctx = document.getElementById('rankingChart');
            if (!ctx || !this.ranking.length) return;
            this.chart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: this.ranking.map(s => s.seller__name),
                    datasets: [{
                        label: 'Total Vendido (R$)',
                        data: this.ranking.map(s => s.total_sold / 100),
                        backgroundColor: this.ranking.map((_, i) => i === 0 ? '#2540ad' : '#a5b4fc'),
                        borderRadius: 8,
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
            });
        },

    }
}
</script>
{% endblock %}

{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}QueroLink{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="/static/css/tailwind.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="/static/js/format.js"></script>
    <style>
        body { font-family: 'Public Sans', system-ui, sans-serif; }

        .surface-hero {
            background: #fff; border-radius: 16px; padding: 2rem; border: 1px solid #e5e7eb;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04), 0 8px 24px -4px rgba(67, 97, 238, 0.08);
        }
        .surface-card {
            background: #fff; border-radius: 12px; padding: 1.25rem; border: 1px solid #e5e7eb; box-shadow: none;
        }
        .surface-flat {
            background: transparent; border-bottom: 1px solid #e5e7eb;
        }
        .input-field {
            padding: 0.625rem 1rem; border: 1px solid #d1d5db; border-radius: 12px;
            outline: none; transition: border-color 0.15s, box-shadow 0.15s;
        }
        .input-field:focus { border-color: #6b7fee; box-shadow: 0 0 0 3px rgba(67,97,238,0.08); }
        .btn-primary {
            padding: 0.625rem 1.25rem; border-radius: 12px;
            background: #4361ee; color: #fff; font-weight: 600; font-size: 14px;
            transition: background 0.15s;
        }
        .btn-primary:hover { background: #3051d3; }
        .btn-primary:disabled { background: #d1d5db; cursor: not-allowed; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">
    <div class="flex h-screen overflow-hidden">
        {% include 'components/_sidebar.html' %}
        <main class="flex-1 overflow-y-auto">
            <div class="p-6 max-w-7xl mx-auto">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}QueroLink{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50:'#eef2ff',100:'#e0e7ff',400:'#6b7fee',500:'#4361ee',600:'#3051d3',700:'#2540ad',900:'#1e2a6e' },
                        success: { 50:'#ecfdf5',500:'#31c48d',700:'#1f9d6e' },
                        warning: { 50:'#fffbeb',500:'#d97706',700:'#92400e' },
                        danger: { 50:'#fef2f2',500:'#e53e3e',700:'#b91c1c' },
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-900">
    <div class="flex h-screen overflow-hidden">
        {% include 'components/_sidebar.html' %}
        <main class="flex-1 overflow-y-auto">
            <div class="p-6 max-w-7xl mx-auto">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mérito{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="/static/css/tailwind.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js" defer integrity="sha384-9Ax3MmS9AClxJyd5/zafcXXjxmwFhZCdsT6HJoJjarvCaAkJlk5QDzjLJm+Wdx5F" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" integrity="sha384-e6nUZLBkQ86NJ6TVVKAeSaK8jWa3NhkYWZFomE39AvDbQWeie9PlQqM3pmYW5d1g" crossorigin="anonymous"></script>
    <script src="/static/js/format.js"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }

        .surface-hero {
            background: #fff; border-radius: 16px; padding: 2rem;
            box-shadow: 0 1px 2px rgba(11, 17, 32, 0.04), 0 4px 12px rgba(11, 17, 32, 0.04);
        }
        .surface-card {
            background: #fff; border-radius: 12px; padding: 1.25rem;
            box-shadow: 0 1px 2px rgba(11, 17, 32, 0.04), 0 2px 8px rgba(11, 17, 32, 0.04);
        }
        .surface-flat {
            background: transparent;
        }
        .input-field {
            padding: 0.625rem 1rem; border: 1px solid #d1d5db; border-radius: 12px;
            outline: none; transition: border-color 0.15s, box-shadow 0.15s;
        }
        .input-field:focus { border-color: #66a3ff; box-shadow: 0 0 0 3px rgba(18,99,255,0.08); }
        .btn-primary {
            padding: 0.625rem 1.25rem; border-radius: 12px;
            background: #1463FF; color: #fff; font-weight: 600; font-size: 14px;
            transition: background 0.15s;
        }
        .btn-primary:hover { background: #0d52d9; }
        .btn-primary:disabled { background: #d1d5db; cursor: not-allowed; }
        .toast-enter { animation: toastIn 0.3s ease forwards; }
        .toast-leave { animation: toastOut 0.3s ease forwards; }
        @keyframes toastIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes toastOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
    </style>
    <script>
        function getCSRFToken() {
            var name = 'csrftoken';
            var cookies = document.cookie.split(';');
            for (var i = 0; i < cookies.length; i++) {
                var c = cookies[i].trim();
                if (c.indexOf(name + '=') === 0) return c.substring(name.length + 1);
            }
            return '';
        }
        function showToast(message, type, duration) {
            var c = {
                success: { bg: 'bg-emerald-50', border: 'border-emerald-200', text: 'text-emerald-700', dot: 'bg-emerald-500', icon: '<svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>' },
                error:   { bg: 'bg-red-50', border: 'border-red-200', text: 'text-red-700', dot: 'bg-red-500', icon: '<svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>' },
                warning: { bg: 'bg-amber-50', border: 'border-amber-200', text: 'text-amber-700', dot: 'bg-amber-500', icon: '<svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"></path></svg>' },
                info:    { bg: 'bg-blue-50', border: 'border-blue-200', text: 'text-blue-700', dot: 'bg-blue-500', icon: '<svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>' },
            };
            var s = c[type] || c.info;
            duration = duration || (type === 'error' ? 6000 : 4000);
            var el = document.createElement('div');
            el.className = 'pointer-events-auto flex items-start gap-3 px-4 py-3 rounded-xl border shadow-lg toast-enter ' + s.bg + ' ' + s.border;
            el.innerHTML = '<div class="flex-shrink-0 mt-0.5">' + s.icon + '</div>'
                + '<div class="flex-1 min-w-0"><p class="text-sm font-medium ' + s.text + '"></p></div>'
                + '<button onclick="this.parentElement.remove()" class="flex-shrink-0 text-gray-400 hover:text-gray-600 transition"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>'
                + '<div class="absolute bottom-0 left-0 h-0.5 rounded-full ' + s.dot + '" style="width:100%;animation:shrink ' + duration + 'ms linear forwards;"></div>';
            el.querySelector('p').textContent = message;
            document.getElementById('toast-container').appendChild(el);
            setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, duration + 300);
        }
    </script>
</head>
<body class="text-gray-900" style="background: #F5F7FA;">
    <div id="toast-container" class="fixed top-4 right-4 z-[9999] flex flex-col gap-2 pointer-events-none max-w-sm w-full"></div>

    {% if show_trial_banner %}
    <div id="trial-banner" class="bg-graphite text-white py-2.5 px-4 text-[13px] font-medium flex items-center justify-center gap-2 sticky top-0 z-30">
        <svg class="w-4 h-4 text-accent flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span>Seu periodo de teste termina em {{ trial_days_left }} dia{{ trial_days_left|pluralize }}.</span>
        <a href="{% url 'dashboard:assinatura' %}" class="text-accent font-semibold whitespace-nowrap">Assinar agora →</a>
        <button onclick="document.getElementById('trial-banner').remove(); sessionStorage.setItem('trial_banner_dismissed', '1');" class="text-white/50 hover:text-white p-1 ml-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
    </div>
    <script>
        if (sessionStorage.getItem('trial_banner_dismissed')) {
            var b = document.getElementById('trial-banner');
            if (b) b.remove();
        }
    </script>
    {% endif %}

    <div class="flex h-screen overflow-hidden">
        {% include 'components/_sidebar.html' %}
        <main class="flex-1 overflow-y-auto">
            <div class="p-6 max-w-7xl mx-auto">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - QueroLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card glass">
            <div class="login-header">
                <h1 style="font-family: 'Lexend', system-ui, sans-serif;">QueroLink</h1>
                <p style="color: var(--text-secondary); font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.05em;">Acesse seu painel administrativo</p>
            </div>
            
                {% if messages %}
                <script>
                {% for message in messages %}
                showToast("{{ message|escapejs }}", "{% if message.tags == 'error' %}error{% elif message.tags == 'success' %}success{% else %}info{% endif %}");
                {% endfor %}
                </script>
                {% endif %}

            <form method="post" action="{% url 'dashboard:login' %}">
                {% csrf_token %}
                {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
                {% endif %}
                <div class="form-group">
                    <label class="form-label" for="identifier">E-mail ou usuario</label>
                    <input type="text" id="identifier" name="identifier" class="form-control" required placeholder="seu@email.com ou usuario" autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Senha</label>
                    <input type="password" id="password" name="password" class="form-control" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary">Entrar no Dashboard</button>
            </form>

            <p style="text-align: center; margin-top: 24px; color: var(--text-secondary); font-size: 0.875rem;">
                Ainda não tem uma conta?
                <a href="{% url 'accounts:sobre' %}" style="color: var(--primary-color); font-weight: 500;">Conheca o QueroLink</a>
            </p>
            <p style="text-align: center; margin-top: 8px;">
                <a href="{% url 'accounts:signup' %}" style="color: var(--text-secondary); font-size: 0.8rem;">Cadastre sua loja</a>
            </p>
        </div>
    </div>
</body>
</html>

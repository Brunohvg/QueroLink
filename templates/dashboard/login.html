{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — VendaPay</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="/static/css/tailwind.css" rel="stylesheet">
    <script>
        function getCSRFToken() {
            var name = 'csrftoken';
            var cookies = document.cookie.split(';');
            for (var i = 0; i < cookies.length; i++) {
                var c = cookies[i].trim();
                if (c.indexOf(name + '=') === 0) return c.substring(name.length + 1);
            }
            return '';
        }
        function showToast(message, type) {
            var c = {
                success: { bg: 'bg-emerald-50', border: 'border-emerald-200', text: 'text-emerald-700', icon: '<svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>' },
                error:   { bg: 'bg-red-50', border: 'border-red-200', text: 'text-red-700', icon: '<svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>' },
            };
            var s = c[type] || c.info;
            var el = document.createElement('div');
            el.className = 'pointer-events-auto flex items-start gap-3 px-4 py-3 rounded-2xl border shadow-lg fixed top-4 right-4 z-[9999] max-w-sm w-full animate-slide-in ' + s.bg + ' ' + s.border;
            el.innerHTML = '<div class="flex-shrink-0 mt-0.5">' + s.icon + '</div><div class="flex-1"><p class="text-sm font-medium ' + s.text + '">' + message + '</p></div><button onclick="this.parentElement.remove()" class="flex-shrink-0 ml-1"><svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>';
            document.body.appendChild(el);
            setTimeout(function() { if (el.parentNode) el.remove(); }, 4000);
        }
    </script>
    <style>
        body { font-family: 'Public Sans', system-ui, sans-serif; background: #f8f9fc; }
        @keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .animate-slide-in { animation: slideIn 0.35s cubic-bezier(0.21, 1.02, 0.73, 1) forwards; }
        input, button { font-size: 16px !important; }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex items-center justify-center p-4">
    {% if messages %}
    <script>
    {% for message in messages %}
    showToast("{{ message|escapejs }}", "{% if message.tags == 'error' %}error{% elif message.tags == 'success' %}success{% else %}info{% endif %}");
    {% endfor %}
    </script>
    {% endif %}

    <div class="w-full max-w-sm">
        <div class="text-center mb-10">
            <div class="w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-lg shadow-brand-100" style="background: linear-gradient(135deg, #4361ee, #2540ad);">
                <svg class="w-9 h-9 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            </div>
            <h1 class="font-display text-[28px] font-bold text-gray-900 tracking-tight">VendaPay</h1>
            <p class="text-[14px] text-gray-400 mt-2 font-medium">Acesso administrativo</p>
        </div>

        <form method="post" action="{% url 'dashboard:login' %}" class="space-y-5">
            {% csrf_token %}
            {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
            {% endif %}
            <div>
                <label for="identifier" class="block text-[14px] font-medium text-gray-700 mb-1.5">E-mail ou usuario</label>
                <input type="text" id="identifier" name="identifier" required autofocus
                       class="w-full px-4 py-3 bg-white border-2 border-gray-100 rounded-2xl text-[16px] outline-none transition-all focus:border-brand-400 focus:ring-2 focus:ring-brand-100"
                       placeholder="seu@email.com">
            </div>
            <div>
                <label for="password" class="block text-[14px] font-medium text-gray-700 mb-1.5">Senha</label>
                <input type="password" id="password" name="password" required
                       class="w-full px-4 py-3 bg-white border-2 border-gray-100 rounded-2xl text-[16px] outline-none transition-all focus:border-brand-400 focus:ring-2 focus:ring-brand-100"
                       placeholder="Sua senha">
            </div>
            <button type="submit"
                    class="w-full py-3.5 bg-gray-900 hover:bg-gray-800 text-white font-semibold rounded-2xl transition-all text-[15px] shadow-lg shadow-gray-200 active:scale-[0.97]">
                Entrar
            </button>
            <label class="flex items-center gap-2.5 cursor-pointer">
              <input type="checkbox" name="remember_me" value="1"
                     class="w-4 h-4 rounded border-gray-300 text-brand-500 focus:ring-brand-200 cursor-pointer">
              <span class="text-[13px] text-gray-500 font-medium">Manter conectado</span>
            </label>
        </form>

        <div class="text-center mt-6">
            <p class="text-[13px] text-gray-400">
                Ainda nao tem uma conta?
                <a href="{% url 'accounts:signup' %}" class="text-brand-600 hover:text-brand-700 font-medium">Cadastre-se</a>
            </p>
        </div>
    </div>
</body>
</html>

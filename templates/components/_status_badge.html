{% comment %}
Usage: include components/_status_badge.html with status='FECHADA'
CommissionPeriod status: ABERTA | FECHADA | PAGA | AJUSTADA | CANCELADA
Also works for: ativo/inativo (is_active)
{% endcomment %}
<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium
    {% if status == 'ABERTA' or status == 'PENDING' or status == False %}bg-gray-100 text-gray-600
    {% elif status == 'FECHADA' %}bg-warning-50 text-warning-700
    {% elif status == 'AJUSTADA' %}bg-amber-50 text-amber-700
    {% elif status == 'CANCELADA' %}bg-danger-50 text-danger-700
    {% elif status == 'PAGA' or status == 'COMPLETED' or status == 'PAID' or status == True %}bg-success-50 text-success-700 font-semibold
    {% elif status == 'SENT' %}bg-brand-50 text-brand-600
    {% elif status == 'FAILED' or status == 'CANCELED' %}bg-danger-50 text-danger-700
    {% else %}bg-gray-100 text-gray-600{% endif %}">
    {% if label %}{{ label }}{% else %}{{ status }}{% endif %}
</span>

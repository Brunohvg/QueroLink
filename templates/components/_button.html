{# Usage: {% include 'components/_button.html' with variant='primary' label='Salvar' type='submit' %}
   Variants: primary | secondary | danger | success
   Optional: icon_svg (HTML string), href (renders as <a> instead of <button>), onclick, disabled, class #}
{% if href %}
<a href="{{ href }}" {% if onclick %}onclick="{{ onclick }}"{% endif %}
   class="{% if variant == 'primary' %}bg-brand-500 hover:bg-brand-600 text-white shadow-lg
          {% elif variant == 'secondary' %}bg-gray-100 hover:bg-gray-200 text-gray-700
          {% elif variant == 'danger' %}bg-danger-500 hover:bg-danger-700 text-white shadow-md
          {% elif variant == 'success' %}bg-success-500 hover:bg-success-700 text-white shadow-md
          {% else %}bg-brand-500 hover:bg-brand-600 text-white shadow-lg{% endif %}
          font-medium rounded-xl transition tap-target inline-flex items-center justify-center gap-2
          {% if size == 'sm' %}py-2 px-4 text-sm{% elif size == 'lg' %}py-4 px-8 text-base{% else %}py-3 px-6 text-[15px]{% endif %}
          {% if disabled %}opacity-50 cursor-not-allowed{% endif %}
          {{ class }}">
    {% if icon_svg %}{{ icon_svg|safe }}{% endif %}
    {{ label }}
</a>
{% else %}
<button type="{{ type|default:'button' }}" {% if onclick %}onclick="{{ onclick }}"{% endif %}
        {% if disabled %}disabled{% endif %}
        class="{% if variant == 'primary' %}bg-brand-500 hover:bg-brand-600 text-white shadow-lg
               {% elif variant == 'secondary' %}bg-gray-100 hover:bg-gray-200 text-gray-700
               {% elif variant == 'danger' %}bg-danger-500 hover:bg-danger-700 text-white shadow-md
               {% elif variant == 'success' %}bg-success-500 hover:bg-success-700 text-white shadow-md
               {% else %}bg-brand-500 hover:bg-brand-600 text-white shadow-lg{% endif %}
               font-medium rounded-xl transition tap-target inline-flex items-center justify-center gap-2
               {% if size == 'sm' %}py-2 px-4 text-sm{% elif size == 'lg' %}py-4 px-8 text-base{% else %}py-3 px-6 text-[15px]{% endif %}
               {% if disabled %}opacity-50 cursor-not-allowed{% endif %}
               {{ class }}">
    {% if icon_svg %}{{ icon_svg|safe }}{% endif %}
    {{ label }}
</button>
{% endif %}

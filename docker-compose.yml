version: "3.8"

# ============================================================
# QueroLink — docker-compose.yml
# Uso: docker compose up -d --build
# ============================================================

services:
  # ── Aplicação principal (Django + Gunicorn) ──────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    stop_grace_period: 2m
    environment:
      - DJANGO_SETTINGS_MODULE=app.config.settings.production
      - SECRET_KEY
      - DATABASE_URL
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@querolink-redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - API_KEY_PAGAR_ME=${API_KEY_PAGAR_ME:-}
      - API_KEY_INSTANCIA=${API_KEY_INSTANCIA:-}
      - INSTANCE=${INSTANCE:-}
      - JWT_ACCESS_TOKEN_LIFETIME_MINUTES=${JWT_ACCESS_TOKEN_LIFETIME_MINUTES:-30}
      - JWT_REFRESH_TOKEN_LIFETIME_DAYS=${JWT_REFRESH_TOKEN_LIFETIME_DAYS:-7}
      - SEED_ON_START=${SEED_ON_START:-false}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-}
      - FERNET_KEY
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-3}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-120}
      - SERVICE_URL_WEB=${SERVICE_URL_WEB:-}
      - SERVICE_FQDN_WEB=${SERVICE_FQDN_WEB:-}
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      - CONN_MAX_AGE=${CONN_MAX_AGE:-600}
      - LOG_LEVEL=${LOG_LEVEL:-WARNING}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      querolink-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
    networks:
      - coolify

  # ── Redis (broker Celery) ────────────────────────────────
  querolink-redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_local_dev}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis_local_dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - coolify

  # ── Celery Worker (tarefas assíncronas) ──────────────────
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.config worker --loglevel=info --concurrency=2 --time-limit=600 --soft-time-limit=540
    restart: always
    stop_grace_period: 5m
    environment:
      - DJANGO_SETTINGS_MODULE=app.config.settings.production
      - SECRET_KEY
      - DATABASE_URL
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@querolink-redis:6379/0
      - API_KEY_PAGAR_ME=${API_KEY_PAGAR_ME:-}
      - API_KEY_INSTANCIA=${API_KEY_INSTANCIA:-}
      - INSTANCE=${INSTANCE:-}
      - FERNET_KEY
    depends_on:
      querolink-redis:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "app.config", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - coolify

  # ── Celery Beat (tarefas agendadas) ──────────────────────
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.config beat --loglevel=info --schedule=/app/celerybeat-schedule/celerybeat-schedule
    restart: always
    stop_grace_period: 1m
    environment:
      - DJANGO_SETTINGS_MODULE=app.config.settings.production
      - SECRET_KEY
      - DATABASE_URL
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@querolink-redis:6379/0
      - API_KEY_PAGAR_ME=${API_KEY_PAGAR_ME:-}
      - API_KEY_INSTANCIA=${API_KEY_INSTANCIA:-}
      - INSTANCE=${INSTANCE:-}
      - FERNET_KEY
    depends_on:
      querolink-redis:
        condition: service_healthy
      web:
        condition: service_healthy
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    volumes:
      - celery_beat_schedule:/app/celerybeat-schedule
    networks:
      - coolify

volumes:
  redis_data:
  static_volume:
  media_volume:
  celery_beat_schedule:

networks:
  coolify:
    external: true

version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: quero-link-web:latest
    restart: always
    environment:
      - DJANGO_SETTINGS_MODULE=app.config.settings.production
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://querolink-redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - API_KEY_PAGAR_ME=${API_KEY_PAGAR_ME}
      - API_KEY_INSTANCIA=${API_KEY_INSTANCIA}
      - INSTANCE=${INSTANCE}
    ports:
      - "8001:8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      querolink-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - coolify


  querolink-redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - coolify

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.config worker --loglevel=info
    restart: always
    environment:
      - DJANGO_SETTINGS_MODULE=app.config.settings.production
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://querolink-redis:6379/0
      - API_KEY_PAGAR_ME=${API_KEY_PAGAR_ME}
      - API_KEY_INSTANCIA=${API_KEY_INSTANCIA}
      - INSTANCE=${INSTANCE}
    depends_on:
      querolink-redis:
        condition: service_healthy
    networks:
      - coolify

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.config beat --loglevel=info
    restart: always
    environment:
      - DJANGO_SETTINGS_MODULE=app.config.settings.production
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://querolink-redis:6379/0
      - API_KEY_PAGAR_ME=${API_KEY_PAGAR_ME}
      - API_KEY_INSTANCIA=${API_KEY_INSTANCIA}
      - INSTANCE=${INSTANCE}
    depends_on:
      querolink-redis:
        condition: service_healthy
    networks:
      - coolify

volumes:
  redis_data:
  static_volume:
  media_volume:

networks:
  coolify:
    external: true

version: "3.8"

# ============================================================
# V-Com — docker-compose.yml
# Uso: docker compose up -d --build
# ============================================================

services:
  # ── Aplicação principal (Django + Gunicorn) ──────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    stop_grace_period: 2m
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=app.config.settings.production
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@querolink-redis:6379/0
      - JWT_ACCESS_TOKEN_LIFETIME_MINUTES=${JWT_ACCESS_TOKEN_LIFETIME_MINUTES:-30}
      - JWT_REFRESH_TOKEN_LIFETIME_DAYS=${JWT_REFRESH_TOKEN_LIFETIME_DAYS:-7}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      - CONN_MAX_AGE=${CONN_MAX_AGE:-600}
      - LOG_LEVEL=${LOG_LEVEL:-WARNING}
    volumes:
      - media_volume:/app/media
    depends_on:
      querolink-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
    networks:
      - coolify

  # ── Redis (broker Celery) ────────────────────────────────
  querolink-redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_local_dev}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis_local_dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - coolify

  # ── Celery Worker (tarefas assíncronas) ──────────────────
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.config worker --loglevel=info --concurrency=2 --time-limit=600 --soft-time-limit=540
    restart: always
    stop_grace_period: 5m
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=app.config.settings.production
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@querolink-redis:6379/0
      - DATABASE_URL=${DATABASE_URL:?}
      - RCLONE_CONFIG_GDRIVE_TYPE=${RCLONE_CONFIG_GDRIVE_TYPE:?}
      - RCLONE_CONFIG_GDRIVE_SCOPE=${RCLONE_CONFIG_GDRIVE_SCOPE:-drive}
      - RCLONE_CONFIG_GDRIVE_TOKEN=${RCLONE_CONFIG_GDRIVE_TOKEN:?}
      - GDRIVE_PATH=${GDRIVE_PATH:-querolink-backups}
    depends_on:
      querolink-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "app.config", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - backup_volume:/app/backups
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - coolify

  # ── Celery Beat (tarefas agendadas) ──────────────────────
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.config beat --loglevel=info --schedule=/app/celerybeat-schedule/celerybeat-schedule
    restart: always
    stop_grace_period: 1m
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=app.config.settings.production
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@querolink-redis:6379/0
    depends_on:
      querolink-redis:
        condition: service_healthy
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    volumes:
      - backup_volume:/app/backups
      - celery_beat_schedule:/app/celerybeat-schedule
    networks:
      - coolify

volumes:
  redis_data:
  media_volume:
  celery_beat_schedule:
  backup_volume:

networks:
  coolify:
    external: true

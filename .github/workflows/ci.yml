name: CI

on:
  push:
    branches: [main, querolink-v2]
  pull_request:
    branches: [main, querolink-v2]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: querolink_ci
          POSTGRES_USER: querolink
          POSTGRES_PASSWORD: querolink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U querolink -d querolink_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements/production.txt

      - name: Install dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/production.txt

      - name: Django system check
        env:
          DJANGO_SETTINGS_MODULE: app.config.settings.ci_postgres
          SECRET_KEY: ci-test-secret-key-not-for-production
          DATABASE_URL: postgres://querolink:querolink@localhost:5432/querolink_ci
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py check

      - name: Django production deploy check
        env:
          DJANGO_SETTINGS_MODULE: app.config.settings.production
          SECRET_KEY: ci-test-secret-key-not-for-production
          DATABASE_URL: postgres://querolink:querolink@localhost:5432/querolink_ci
          REDIS_URL: redis://localhost:6379/0
          FERNET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          ALLOWED_HOSTS: localhost,127.0.0.1
          MP_ACCESS_TOKEN: ''
          MP_WEBHOOK_SECRET: ''
          SECURE_SSL_REDIRECT: 'False'
          SESSION_COOKIE_SECURE: 'False'
          CSRF_COOKIE_SECURE: 'False'
          DB_SSL_REQUIRE: 'False'
        run: python manage.py check --deploy

      - name: Check pending migrations
        env:
          DJANGO_SETTINGS_MODULE: app.config.settings.ci_postgres
          SECRET_KEY: ci-test-secret-key-not-for-production
          DATABASE_URL: postgres://querolink:querolink@localhost:5432/querolink_ci
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py makemigrations --check --dry-run

      - name: Show migration plan
        env:
          DJANGO_SETTINGS_MODULE: app.config.settings.ci_postgres
          SECRET_KEY: ci-test-secret-key-not-for-production
          DATABASE_URL: postgres://querolink:querolink@localhost:5432/querolink_ci
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py migrate --plan

      # ── Migrate, create a fresh test database, run tests ──
      - name: Run full test suite
        env:
          DJANGO_SETTINGS_MODULE: app.config.settings.ci_postgres
          SECRET_KEY: ci-test-secret-key-not-for-production
          DATABASE_URL: postgres://querolink:querolink@localhost:5432/querolink_ci
          REDIS_URL: redis://localhost:6379/0
        run: |
          set +e
          python manage.py test -v2 --buffer --parallel > test-output.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "Django test failure summary:"
            grep -E '^(ERROR|FAIL):|^Ran |^FAILED \(' test-output.log || true
          fi
          exit "$code"

      # ── Upload test log on failure ──
      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.log

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build:css

      - name: Compress built assets
        run: gzip -kf static/css/tailwind.css 2>/dev/null || true

  config-and-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker compose configuration
        env:
          DATABASE_URL: postgres://u:p@localhost:5432/db
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_TOKEN: '{}'
        run: |
          touch .env
          docker compose config

      - name: Check shell script syntax
        run: |
          for f in scripts/*.sh; do
            echo "Checking $f..."
            bash -n "$f"
          done
          echo "All shell scripts syntax OK"

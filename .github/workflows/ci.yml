name: CI

on:
  push:
    branches: [main, querolink-v2]
  pull_request:
    branches: [main, querolink-v2]

jobs:
  backend-sqlite:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/production.txt

      - name: Django system check
        env:
          DJANGO_SETTINGS_MODULE: app.config.settings.local
          SECRET_KEY: ci-test-secret-key-not-for-production
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py check

      - name: Django production deploy check
        env:
          DJANGO_SETTINGS_MODULE: app.config.settings.production
          SECRET_KEY: ci-test-secret-key-not-for-production
          DATABASE_URL: sqlite:///db.sqlite3
          REDIS_URL: redis://localhost:6379/0
          FERNET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          ALLOWED_HOSTS: localhost,127.0.0.1
          MP_ACCESS_TOKEN: ''
          MP_WEBHOOK_SECRET: ''
          SECURE_SSL_REDIRECT: 'False'
          SESSION_COOKIE_SECURE: 'False'
          CSRF_COOKIE_SECURE: 'False'
        run: python manage.py check --deploy

      - name: Check pending migrations
        env:
          DJANGO_SETTINGS_MODULE: app.config.settings.local
          SECRET_KEY: ci-test-secret-key-not-for-production
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: app.config.settings.local
          SECRET_KEY: ci-test-secret-key-not-for-production
          REDIS_URL: redis://localhost:6379/0
        run: |
          set +e
          python manage.py test -v2 --buffer > test-output.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "Django test failure summary:"
            grep -E '^(ERROR|FAIL):|^Ran |^FAILED \(' test-output.log || true
          fi
          exit "$code"

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: querolink_ci
          POSTGRES_USER: querolink
          POSTGRES_PASSWORD: querolink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U querolink -d querolink_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/production.txt

      - name: Django system check
        env:
          DJANGO_SETTINGS_MODULE: app.config.settings.ci_postgres
          SECRET_KEY: ci-test-secret-key-not-for-production
          DATABASE_URL: postgres://querolink:querolink@localhost:5432/querolink_ci
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py check

      - name: Check pending migrations
        env:
          DJANGO_SETTINGS_MODULE: app.config.settings.ci_postgres
          SECRET_KEY: ci-test-secret-key-not-for-production
          DATABASE_URL: postgres://querolink:querolink@localhost:5432/querolink_ci
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: app.config.settings.ci_postgres
          SECRET_KEY: ci-test-secret-key-not-for-production
          DATABASE_URL: postgres://querolink:querolink@localhost:5432/querolink_ci
          REDIS_URL: redis://localhost:6379/0
        run: |
          set +e
          python manage.py test -v2 --buffer > test-output.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "Django test failure summary:"
            grep -E '^(ERROR|FAIL):|^Ran |^FAILED \(' test-output.log || true
          fi
          exit "$code"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and build CSS
        run: |
          npm install
          npm run build:css

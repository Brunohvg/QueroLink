name: Apply production hardening

on:
  push:
    branches: [fix/production-hardening-30]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-hardening-30
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply guarded patches
        run: python scripts/apply_prompt30_hardening.py

      - name: Review generated diff
        run: |
          git status --short
          git diff --check
          git diff --stat

      - name: Commit hardened runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden billing plans and production operations"
          git push origin HEAD:fix/production-hardening-30

name: querolink-test

services:
  test-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: querolink_test
      POSTGRES_USER: querolink_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U querolink_test -d querolink_test"]
      interval: 1s
      timeout: 3s
      retries: 30

  test-redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "127.0.0.1:${TEST_REDIS_PORT:-56379}:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
